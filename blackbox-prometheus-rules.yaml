apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: blackbox-exporter-rules
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
  - name: blackbox-network-connectivity
    interval: 30s
    rules:

    # P0 Emergency: Internet connectivity completely lost
    - alert: InternetConnectivityLost
      expr: probe_success{job="blackbox-exporter", probe_type="icmp", target_type="internet"} == 0
      for: 2m
      labels:
        severity: emergency
        priority: P0
        component: network
      annotations:
        summary: "Internet connectivity lost on cluster"
        description: |
          Node cannot reach internet (ping to {{ $labels.instance }} failed)

          IMPACT:
          - Cannot pull container images from registries
          - Cannot reach external APIs
          - Webhook notifications will fail
          - Application external dependencies unavailable

          ACTIONS:
          1. Check node network interface: kubectl debug node/<node> -- ip addr
          2. Check default gateway: kubectl debug node/<node> -- ip route
          3. Check cloud provider network/firewall rules
          4. Verify security groups allow outbound traffic
          5. Test connectivity: kubectl debug node/<node> -- ping 8.8.8.8

    # P1 Critical: DNS resolution failure
    - alert: DNSResolutionFailed
      expr: probe_success{job="blackbox-exporter", probe_type="dns"} == 0
      for: 1m
      labels:
        severity: critical
        priority: P1
        component: network
      annotations:
        summary: "DNS resolution failing for {{ $labels.instance }}"
        description: |
          Cannot resolve domain name: {{ $labels.instance }}

          IMPACT:
          - Image pulls fail (cannot resolve gcr.io, docker.io)
          - External API calls by hostname fail
          - Service discovery issues
          - Certificate validation failures

          ACTIONS:
          1. Check CoreDNS pods: kubectl get pods -n kube-system -l k8s-app=kube-dns
          2. Check DNS config in pod: kubectl exec <pod> -- cat /etc/resolv.conf
          3. Test DNS manually: kubectl exec <pod> -- nslookup google.com
          4. Check CoreDNS logs: kubectl logs -n kube-system -l k8s-app=kube-dns
          5. Restart CoreDNS if needed: kubectl rollout restart deployment/coredns -n kube-system

    # P1 Critical: HTTP endpoint unreachable
    - alert: HTTPEndpointDown
      expr: probe_success{job="blackbox-exporter", probe_type="http"} == 0
      for: 2m
      labels:
        severity: critical
        priority: P1
        component: application
      annotations:
        summary: "HTTP endpoint {{ $labels.instance }} is unreachable"
        description: |
          HTTP probe failed for {{ $labels.instance }}
          Service: {{ $labels.service }}

          IMPACT:
          - Service is unavailable to users
          - API calls will fail
          - Customer demos may be affected

          ACTIONS:
          1. Check if endpoint is up: curl -v {{ $labels.instance }}
          2. Check related pods: kubectl get pods -n <namespace> -l service={{ $labels.service }}
          3. Check ingress: kubectl get ingress -A
          4. Check service: kubectl get svc -A | grep {{ $labels.service }}
          5. Review application logs for errors

    # P1 Critical: Container registry unreachable
    - alert: ContainerRegistryUnreachable
      expr: probe_success{job="blackbox-exporter", target_type="registry"} == 0
      for: 3m
      labels:
        severity: critical
        priority: P1
        component: infrastructure
      annotations:
        summary: "Container registry {{ $labels.instance }} unreachable"
        description: |
          Cannot reach container registry: {{ $labels.instance }}

          IMPACT:
          - New pod deployments will fail
          - Image pulls fail
          - Cannot scale applications
          - Rollouts blocked

          ACTIONS:
          1. Check registry status: curl -v {{ $labels.instance }}
          2. Verify network connectivity to registry
          3. Check registry credentials: kubectl get secret -A | grep regcred
          4. Test image pull: kubectl run test --image=busybox --restart=Never -- sleep 3600
          5. Check for registry service disruptions

    # P2 Warning: High network latency
    - alert: HighNetworkLatency
      expr: probe_icmp_duration_seconds{job="blackbox-exporter"} > 0.5
      for: 5m
      labels:
        severity: warning
        priority: P2
        component: network
      annotations:
        summary: "High network latency to {{ $labels.instance }}"
        description: |
          Network latency to {{ $labels.instance }}: {{ $value | humanizeDuration }}

          Normal latency should be < 100ms.
          Current latency is {{ $value | humanizeDuration }} which indicates:
          - Network congestion
          - Routing issues
          - Bandwidth saturation

          ACTIONS:
          1. Check network bandwidth utilization
          2. Review recent network changes
          3. Test from multiple locations
          4. Check for DDoS or traffic spikes

    # P2 Warning: Slow HTTP response time
    - alert: SlowHTTPResponseTime
      expr: probe_http_duration_seconds{job="blackbox-exporter"} > 5
      for: 5m
      labels:
        severity: warning
        priority: P2
        component: performance
      annotations:
        summary: "Slow HTTP response from {{ $labels.instance }}"
        description: |
          HTTP response time: {{ $value | humanizeDuration }}

          Target: {{ $labels.instance }}
          Service: {{ $labels.service }}

          This may indicate:
          - Application performance issues
          - Database slowdowns
          - Resource constraints
          - Network congestion

          ACTIONS:
          1. Check application CPU/memory: kubectl top pods -n <namespace>
          2. Review application logs for slow queries
          3. Check database performance
          4. Review recent deployments
          5. Consider scaling if load-related

    # P2 Warning: SSL certificate expiring soon
    - alert: SSLCertificateExpiringSoon
      expr: (probe_ssl_earliest_cert_expiry{job="blackbox-exporter"} - time()) / 86400 < 7
      for: 1h
      labels:
        severity: warning
        priority: P2
        component: security
      annotations:
        summary: "SSL certificate expiring soon for {{ $labels.instance }}"
        description: |
          SSL certificate for {{ $labels.instance }} expires in {{ $value | humanizeDuration }}

          ACTIONS:
          1. Renew SSL certificate
          2. Update cert-manager if using Let's Encrypt
          3. Check certificate issuer: kubectl get certificate -A
          4. Verify cert-manager logs: kubectl logs -n cert-manager deployment/cert-manager
          5. Manually trigger renewal if needed

  - name: blackbox-internal-services
    interval: 30s
    rules:

    # P0 Emergency: Grafana unreachable
    - alert: GrafanaUnreachable
      expr: probe_success{job="blackbox-exporter", service="grafana"} == 0
      for: 2m
      labels:
        severity: emergency
        priority: P0
        component: monitoring
        service: grafana
      annotations:
        summary: "Grafana monitoring portal is down"
        description: |
          Cannot reach Grafana at https://grafana.monitoring.opsmx.org

          IMPACT:
          - Cannot view dashboards
          - Cannot check alerts
          - Monitoring visibility lost

          ACTIONS:
          1. Check Grafana pods: kubectl get pods -n monitoring -l app.kubernetes.io/name=grafana
          2. Check Grafana logs: kubectl logs -n monitoring -l app.kubernetes.io/name=grafana
          3. Check ingress: kubectl get ingress -n monitoring
          4. Check service: kubectl get svc -n monitoring grafana
          5. Restart if needed: kubectl rollout restart deployment/grafana -n monitoring

    # P1 Critical: Prometheus unreachable
    - alert: PrometheusUnreachable
      expr: probe_success{job="blackbox-exporter", service="prometheus"} == 0
      for: 2m
      labels:
        severity: critical
        priority: P1
        component: monitoring
        service: prometheus
      annotations:
        summary: "Prometheus is unreachable"
        description: |
          Cannot reach Prometheus at http://prometheus.sandbox.opsmx.org

          IMPACT:
          - Metrics collection may be affected
          - Alerts may not fire
          - Grafana dashboards may show no data

          ACTIONS:
          1. Check Prometheus pods: kubectl get pods -n monitoring -l app=prometheus
          2. Check Prometheus logs: kubectl logs -n monitoring prometheus-<pod-name>
          3. Check storage: kubectl get pvc -n monitoring
          4. Check if Prometheus is OOMKilled or disk full
          5. Restart if needed: kubectl delete pod prometheus-<pod-name> -n monitoring
