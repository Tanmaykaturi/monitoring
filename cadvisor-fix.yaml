# cAdvisor DaemonSet Patch - Fixes OOMKilled Issues
# Apply with: kubectl patch daemonset cadvisor -n monitoring --patch-file cadvisor-fix.yaml

spec:
  template:
    spec:
      containers:
      - name: cadvisor
        image: gcr.io/cadvisor/cadvisor:v0.49.1
        args:
          - --housekeeping_interval=30s
          - --max_housekeeping_interval=35s
          - --event_storage_event_limit=default=0
          - --event_storage_age_limit=default=0
          - --store_container_labels=false
        resources:
          requests:
            memory: "256Mi"
            cpu: "150m"
          limits:
            memory: "800Mi"
            cpu: "300m"
