apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus-ingress
  namespace: monitoring
  annotations:
    cert-manager.io/issuer: letsencrypt-monitoring
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - prometheus.your-domain.com  # UPDATE WITH YOUR DOMAIN
    secretName: prometheus-tls-cert
  rules:
  - host: prometheus.your-domain.com  # UPDATE WITH YOUR DOMAIN
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: prometheus-operated
            port:
              number: 9090
