apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus-ingress
  namespace: monitoring
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt  # Add this
spec:
  ingressClassName: nginx
  tls:  # Add this section
  - hosts:
    - prometheus.your-domain.com
    secretName: prometheus-tls-cert
  rules:
  - host: prometheus.your-domain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: prometheus-operated
            port:
              number: 9090
