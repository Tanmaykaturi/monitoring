grafana:
  enabled: false

alertmanager:
  enabled: false

prometheus:
  enabled: true
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    externalLabels:
      cluster: "your-cluster-name"  # UPDATE THIS
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: "standard"  # UPDATE THIS based on Step 1.4
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

prometheusOperator:
  enabled: true
