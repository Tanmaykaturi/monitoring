apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-custom-targets
  namespace: monitoring
data:
  # Add custom HTTP endpoints to monitor
  http-targets.yaml: |
    # Public Sandbox endpoints
    - targets:
      - https://prometheus-monitoring.ssd-demo.opsmx.net
      labels:
        cluster: public-sandbox
        service: prometheus
        environment: demo

    # SSD Demo cluster endpoints
    - targets:
      - http://dgraph-alpha.ssd-jan.svc.cluster.local:8080/health
      - http://dgraph-alpha.ssd-dec.svc.cluster.local:8080/health
      labels:
        cluster: ssd-demo
        service: dgraph
        component: alpha

    # Add your application endpoints here
    # - targets:
    #   - https://your-app.example.com/health
    #   labels:
    #     service: your-app
    #     environment: production

  # Network connectivity targets (ICMP ping)
  icmp-targets.yaml: |
    - targets:
      - 8.8.8.8          # Google DNS
      - 1.1.1.1          # Cloudflare DNS
      - 8.8.4.4          # Google secondary DNS
      labels:
        target_type: internet

    # Add your node IPs or external IPs to monitor
    # - targets:
    #   - 10.12.0.216    # Node IP
    #   labels:
    #     target_type: node

  # DNS resolution targets
  dns-targets.yaml: |
    - targets:
      - google.com
      - gcr.io
      - docker.io
      - github.com
      labels:
        target_type: external

    - targets:
      - kubernetes.default.svc.cluster.local
      labels:
        target_type: internal

  # TCP connectivity targets (check if port is open)
  tcp-targets.yaml: |
    # Check if Dgraph ports are accessible
    - targets:
      - dgraph-alpha.ssd-jan.svc.cluster.local:8080
      - dgraph-alpha.ssd-jan.svc.cluster.local:9080
      labels:
        service: dgraph
        component: alpha

    # Add your database or service ports here
    # - targets:
    #   - postgres.default.svc.cluster.local:5432
    #   labels:
    #     service: postgres

---
# ServiceMonitor to scrape blackbox metrics with custom targets
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: blackbox-exporter-custom
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-blackbox-exporter
  endpoints:
  # HTTP probes
  - port: http
    interval: 30s
    path: /probe
    params:
      module: [http_2xx]
    relabelings:
    - sourceLabels: [__address__]
      targetLabel: __param_target
    - sourceLabels: [__param_target]
      targetLabel: instance
    - targetLabel: __address__
      replacement: prometheus-blackbox-exporter:9115
    - sourceLabels: [__meta_kubernetes_service_name]
      targetLabel: job
      replacement: blackbox-exporter

  # ICMP probes
  - port: http
    interval: 30s
    path: /probe
    params:
      module: [icmp]
    relabelings:
    - sourceLabels: [__address__]
      targetLabel: __param_target
    - sourceLabels: [__param_target]
      targetLabel: instance
    - targetLabel: __address__
      replacement: prometheus-blackbox-exporter:9115
    - sourceLabels: [__meta_kubernetes_service_name]
      targetLabel: job
      replacement: blackbox-exporter
